name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check .
      - run: pytest
      - run: nfc-cryst verify-methods
      - run: nfc-cryst evidence --format json > /tmp/evidence.json
      - name: Build and verify installed wheel
        run: |
          python -m build
          python -m venv --system-site-packages /tmp/nfc-cryst-wheel
          /tmp/nfc-cryst-wheel/bin/python -m pip install \
            --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/nfc-cryst-wheel/bin/python \
            "$GITHUB_WORKSPACE/scripts/verify_installed_distribution.py"
